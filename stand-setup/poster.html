<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../src/shared/fonts.css">
<style>
@page{size:A4;margin:0}*{box-sizing:border-box;margin:0}
body{width:210mm;height:297mm;font-family:Inter,sans-serif;color:#160a2e;background:#fff;position:relative;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{position:absolute;left:0;right:0;top:0;height:7mm;background:linear-gradient(90deg,#6b21d9,#b87fff)}
.top{display:flex;align-items:center;gap:4mm;padding:17mm 16mm 0}
.top img{width:16mm;height:16mm;border-radius:4.5mm}.top span{font-size:13mm;font-weight:900;letter-spacing:-.04em}
.sticker{position:absolute;right:8mm;top:117mm;width:48mm;height:48mm;z-index:2;border:1.6mm solid #fff;border-radius:50%;background:#ff3d7f;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transform:rotate(12deg);box-shadow:0 4mm 10mm rgba(255,61,127,.35)}
.sticker .e{font-size:15mm;line-height:1}.sticker b{font-size:7.6mm;font-weight:900;line-height:1.05;margin-top:1.5mm;letter-spacing:-.01em}.sticker small{font-size:3.8mm;font-weight:700;opacity:.9;margin-top:1mm}
.eyebrow{margin:15mm 16mm 0;font-size:5mm;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#6b21d9}
h1{margin:3mm 16mm 0;font-size:27mm;line-height:.95;font-weight:900;letter-spacing:-.045em}
h1 em{font-style:normal;color:#6b21d9;background:linear-gradient(transparent 62%,#f0e3ff 62%)}
.de{margin:5mm 16mm 0;font-size:7mm;color:#5c4a7c;font-weight:600}
.food{display:flex;gap:5mm;margin:10mm 16mm 0}
.food img{flex:1;height:38mm;object-fit:cover;border-radius:6mm}
.qrwrap{position:absolute;left:16mm;right:16mm;bottom:30mm;display:flex;align-items:center;gap:10mm;border:1.6mm solid #6b21d9;border-radius:9mm;padding:8mm}
.qrwrap img{width:64mm;height:64mm}
.steps{font-size:7.6mm;font-weight:900;line-height:1.45}
.steps span{color:#6b21d9}
.steps small{display:block;font-size:4.8mm;color:#7c6fa0;font-weight:600;margin-top:2mm;line-height:1.4}
.foot{position:absolute;left:16mm;right:16mm;bottom:12mm;display:flex;justify-content:space-between;font-size:4.6mm;color:#7c6fa0;font-weight:600}
</style></head><body>
<div class="bar"></div>
<div class="top"><img src="../public/landing/logo.png"><span>Bite</span></div>
<div class="sticker"><div class="e">🍬</div><b>FREE<br>SWEETS</b><small>Süßes gratis</small></div>
<div class="eyebrow">60-second survey · 60-Sekunden-Umfrage</div>
<h1>How does your city <em>eat?</em></h1>
<div class="de">Wie isst deine Stadt? Hilf uns, Bite zu bauen.</div>
<div class="food">
 <img src="../public/app/img/1551183053-800x533.jpg">
 <img src="../public/app/img/1563245372-800x533.jpg">
 <img src="../public/app/img/1574484284002-800x533.jpg">
</div>
<div class="qrwrap"><img src="../public/stand/qr-stand.svg">
<div class="steps"><span>1</span> · Scan<br><span>2</span> · 8 quick taps<br><span>3</span> · Grab a sweet 🍬<small>Scannen · 8 Klicks · Süßes nehmen</small></div></div>
<div class="foot"><span>Real food, real people, your neighbourhood.</span><span>sebaoperti-png.github.io/Bite</span></div>
</body></html>
