<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Bite · A4 table sheet</title><link rel="stylesheet" href="../src/shared/fonts.css">
<!-- A4 sheet for the AIM table: logo, tagline, founder, QR to the 60-second survey.
     Same look as the landing intro (dark purple, bitten "b" wordmark, "Food is better shared"); the crumbs are left out on paper. Print with margins "None" and "Background graphics" on. -->
<style>@page{size:210mm 297mm;margin:0}*{box-sizing:border-box;margin:0;padding:0}
body{width:210mm;height:297mm;font-family:Inter,sans-serif;color:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#0d0620}
.p{position:relative;width:210mm;height:297mm;overflow:hidden;background:radial-gradient(ellipse 80% 70% at 50% 40%,#3b1278 0%,#1c0b3d 55%,#0d0620 100%)}
.stage{position:absolute;left:50%;top:92mm;width:168mm;transform:translateX(-50%)}
.word{display:block;width:100%;height:auto;overflow:visible}
.crumbs{position:absolute;left:60%;top:48%;width:0;height:0}
.crumbs i{position:absolute;border-radius:35%;opacity:.9}
.tag{text-align:center;font-family:'Instrument Serif',serif;font-style:italic;font-size:11.5mm;color:#d6b8ff;margin-top:5mm}
.me{position:absolute;left:18mm;right:18mm;bottom:18mm;display:flex;align-items:flex-end;justify-content:space-between;gap:8mm;border-top:0.3mm solid rgba(214,184,255,.28);padding-top:7mm}
.me .k{font-size:2.8mm;font-weight:900;letter-spacing:.2em;text-transform:uppercase;color:#b87fff}
.me .n{font-family:'Instrument Serif',serif;font-size:12mm;line-height:1;margin-top:1.5mm}
.me .e{font-size:5mm;font-weight:700;color:#d6b8ff;margin-top:1.6mm}
.qr{display:flex;align-items:center;gap:4mm;text-align:right}
.qr span{font-size:3.6mm;font-weight:800;line-height:1.3;color:#fff}
.qr span small{display:block;font-weight:600;color:#b8a3dc;font-size:2.8mm}
.qr img{width:30mm;height:30mm;background:#fff;border-radius:2mm;padding:1.6mm}
</style></head><body><div class="p"><div class="stage"><svg class="word" viewBox="0 0 706 300" role="img" aria-label="Bite">
 <defs>
  <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9c2ff"/></linearGradient>
  <linearGradient id="gb" x1="0" y1="0" x2="0" y2="549" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9c2ff"/></linearGradient>
  <mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="549" height="549"><rect width="549" height="549" fill="#fff"/><path d="M190 405q72 62 144 0" fill="none" stroke="#000" stroke-width="26" stroke-linecap="round"/><circle cx="405" cy="198" r="20"/><circle cx="434" cy="228" r="22"/><circle cx="456" cy="267" r="22"/><circle cx="469" cy="311" r="20"/></mask>
 </defs>
 <g transform="translate(-60 -12) scale(0.6)"><g mask="url(#m)" fill="url(#gb)"><rect x="107" y="30" width="83" height="330" rx="41.5"/><circle cx="285" cy="340" r="178"/></g></g>
 <text x="226" y="296" font-size="330" font-weight="900" fill="url(#g)" font-family="Inter, sans-serif" letter-spacing="-14">ite</text>
</svg><div class="tag">Food is better shared</div></div>
<div class="me"><div><div class="k">Founder</div><div class="n">Sebastiano Operti</div><div class="e">sebaoperti@gmail.com</div></div><div class="qr"><span>Got 60 seconds?<small>Scan · 8 quick taps</small></span><img src="../public/stand/qr-stand.svg" alt="QR code"></div></div></div></body></html>
