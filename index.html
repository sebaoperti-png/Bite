<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      /* theme before first paint (same choice as the app): "bite_theme" = auto | light | dark */
      (function () {
        var c = "auto"; try { c = localStorage.getItem("bite_theme") || "auto"; } catch (e) {}
        var dark = c === "dark" || (c === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <title>Bite — Real food, real people, your neighbourhood</title>
    <meta name="description" content="Bite connects you with home cooks nearby. Share a home-cooked meal, split the cost of the groceries and meet your neighbours." />
    <meta name="keywords" content="home cooking, food sharing, social dining, cost sharing, home cooks, neighbourhood meals, cook together" />
    <meta name="theme-color" content="#6b21d9" />
    <link rel="icon" href="landing/logo.png" />
    <link rel="apple-touch-icon" href="landing/logo.png" />
