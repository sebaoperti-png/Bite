<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      /* theme before first paint (same choice as the app): "bite_theme" = auto | light | dark */
      (function () {
        var c = "auto"; try { c = localStorage.getItem("bite_theme") || "auto"; } catch (e) {}
        var dark = c === "dark" || (c === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <title>Bite — Legal &amp; policies</title>
    <link rel="icon" href="landing/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/legal/main.tsx"></script>
  </body>
</html>
