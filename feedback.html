<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      /* theme before first paint (same choice as the app): "bite_theme" = auto | light | dark */
      (function () {
        var c = "auto"; try { c = localStorage.getItem("bite_theme") || "auto"; } catch (e) {}
        var dark = c === "dark" || (c === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
    <meta name="theme-color" content="#f3eefb" />
    <title>Rate Bite · your feedback</title>
    <meta name="description" content="Tried Bite? Tell us how it felt: two minutes, five short steps." />
    <meta property="og:title" content="Rate Bite" />
    <meta property="og:description" content="Tried Bite? Tell us how it felt: two minutes, five short steps." />
    <meta property="og:image" content="https://bitetable.de/og-image.jpg" />
    <link rel="icon" type="image/png" href="bite-icon-192.png" />
    <link rel="apple-touch-icon" href="bite-apple-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/feedback/main.tsx"></script>
  </body>
</html>
