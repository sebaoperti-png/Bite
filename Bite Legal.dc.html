  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

margin: 0 0 6px; color: #160a2e; }\n  .lg-sec h3 { font-size: 17px; font-weight: 800; margin: 26px 0 8px; color: #2c1a52; }\n  .lg-sec p, .lg-sec li { font-size: 15px; line-height: 1.72; color: #463861; }\n  .lg-sec ul { padding-left: 20px; margin: 8px 0; }\n  .lg-sec li { margin-bottom: 6px; }\n  .lg-toc a { display: block; font-size: 14px; font-weight: 600; color: #6b5a87; padding: 7px 12px; border-radius: 9px; }\n  .lg-toc a:hover { background: #f0e9fb; color: #6b21d9; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh;\">\n  <!-- top bar -->\n  <header style=\"position:sticky; top:0; z-index:50; background:rgba(250,248,252,0.9); backdrop-filter:blur(12px); border-bottom:1px solid rgba(107,33,217,0.1);\">\n    <div style=\"max-width:1080px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; justify-content:space-between;\">\n      <a href=\"Bite Website.dc.html\" style=\"display:flex; align-items:center; gap:9px; color:#160a2e;\">\n        <img src=\"b8bdbd71-3ae0-4bcb-8638-180b841ec0ed\" alt=\"bite\" style=\"width:32px; height:32px; border-radius:9px; display:block;\">\n        <span style=\"font-size:20px; font-weight:900; letter-spacing:-0.04em;\">bite<\u002Fspan>\n      <\u002Fa>\n      <a href=\"Bite Website.dc.html\" style=\"font-size:14px; font-weight:700; color:#6b21d9;\">← Back to bite<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"max-width:1080px; margin:0 auto; padding:44px 24px 90px; display:grid; grid-template-columns:230px 1fr; gap:48px; align-items:start;\">\n    <!-- TOC -->\n    <nav class=\"lg-toc\" style=\"position:sticky; top:100px;\">\n      <div style=\"font-size:12px; font-weight:800; letter-spacing:0.08em; color:#a091bd; padding:0 12px 8px;\">LEGAL &amp; POLICIES<\u002Fdiv>\n      <a href=\"#terms\">Terms of Service<\u002Fa>\n      <a href=\"#privacy\">Privacy Policy<\u002Fa>\n      <a href=\"#cookies\">Cookie Policy<\u002Fa>\n      <a href=\"#community\">Community Guidelines<\u002Fa>\n      <a href=\"#gdpr\">Your data &amp; GDPR rights<\u002Fa>\n      <a href=\"#impressum\">Impressum<\u002Fa>\n      <a href=\"#accessibility\">Accessibility<\u002Fa>\n      <a href=\"#slavery\">Modern Slavery Statement<\u002Fa>\n    <\u002Fnav>\n\n    <main>\n      <div style=\"margin-bottom:38px;\">\n        <h1 style=\"font-size:38px; font-weight:900; letter-spacing:-0.03em; margin:0 0 8px;\">Legal &amp; policies<\u002Fh1>\n        <p style=\"font-size:15px; color:#6b5a87; margin:0;\">Operated by <strong>bite GmbH<\u002Fstrong>, Frankfurt am Main, Germany. Last updated 13 July 2026.<\u002Fp>\n        <div style=\"margin-top:14px; background:#fef6e7; border:1px solid #f6dfb0; border-radius:12px; padding:13px 16px; font-size:13.5px; color:#7a5a12;\">These documents are drafted to meet EU/German requirements (GDPR, DSGVO, DDG/TMG). Placeholders marked <strong>[…]<\u002Fstrong> must be completed and reviewed by qualified legal counsel before go-live.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- TERMS -->\n      <section id=\"terms\" class=\"lg-sec\" style=\"margin-bottom:56px;\">\n        <h2>Terms of Service<\u002Fh2>\n        <p style=\"color:#8a7aa8; font-size:13px; margin:0;\">Effective 13 July 2026<\u002Fp>\n        <h3>1. Who we are &amp; what bite is<\u002Fh3>\n        <p>bite is an online marketplace operated by bite GmbH (\"bite\", \"we\", \"us\") that connects people who cook at home (\"Hosts\") with people who want to buy, share or learn to cook a meal (\"Guests\"). bite provides the platform only. <strong>We are not the producer, seller, or supplier of any meal.<\u002Fstrong> Contracts for a meal are formed directly between the Host and the Guest.<\u002Fp>\n        <h3>2. Eligibility &amp; accounts<\u002Fh3>\n        <p>You must be at least 18 years old and able to enter a binding contract to use bite. You are responsible for the accuracy of your account information and for all activity under your account. Keep your credentials secure and notify us of any unauthorised use.<\u002Fp>\n        <h3>3. Host responsibilities<\u002Fh3>\n        <ul>\n          <li>Prepare food in hygienic conditions and comply with all applicable food-safety, hygiene and labelling laws (incl. Regulation (EU) No 1169/2011 and the German LFGB).<\u002Fli>\n          <li>Accurately declare ingredients, the 14 major allergens, and dietary information for every listing.<\u002Fli>\n          <li>Hold any registrations, permits or insurance required for your activity, and declare and pay any taxes due on your earnings.<\u002Fli>\n          <li>Only list meals you are genuinely able and licensed to provide.<\u002Fli>\n        <\u002Ful>\n        <h3>4. Guest responsibilities<\u002Fh3>\n        <p>Provide accurate information, communicate allergies or dietary needs to the Host before booking, attend or cancel bookings responsibly, and treat Hosts and their homes with respect.<\u002Fp>\n        <h3>5. Bookings, prices &amp; payments<\u002Fh3>\n        <p>Prices are set by Hosts and shown inclusive of applicable taxes where required. All payments are processed in-app through our payment service provider; <strong>off-platform or cash payments are prohibited.<\u002Fstrong> A guest service fee may apply and is shown before you pay. bite retains a platform commission from each booking; Hosts receive the remainder via automatic weekly payout.<\u002Fp>\n        <h3>6. Cancellations &amp; refunds<\u002Fh3>\n        <ul>\n          <li><strong>Host cancels:<\u002Fstrong> the Guest receives a full refund automatically.<\u002Fli>\n          <li><strong>Guest cancels &gt; 24h before:<\u002Fstrong> full refund.<\u002Fli>\n          <li><strong>Guest cancels &lt; 24h before:<\u002Fstrong> the service fee may be non-refundable.<\u002Fli>\n          <li>Because meals are perishable/personalised, the statutory right of withdrawal for distance contracts may not apply once preparation has begun (§ 312g (2) BGB).<\u002Fli>\n        <\u002Ful>\n        <h3>7. Reviews &amp; content<\u002Fh3>\n        <p>You grant bite a non-exclusive, worldwide, royalty-free licence to host and display content you submit (listings, photos, reviews, messages) for the purpose of operating the service. Content must be truthful, lawful and your own. We may remove content that breaches these Terms or our Community Guidelines.<\u002Fp>\n        <h3>8. Prohibited conduct<\u002Fh3>\n        <p>No illegal, unsafe, fraudulent, discriminatory, harassing or off-platform activity; no misrepresentation of food, ingredients or identity; no circumvention of fees. Breach may lead to immediate suspension.<\u002Fp>\n        <h3>9. Liability<\u002Fh3>\n        <p>bite is liable without limitation for intent and gross negligence and under the German Product Liability Act, and for injury to life, body or health. For slight negligence we are liable only for breach of a material contractual obligation, limited to foreseeable, typical damage. As bite is an intermediary, it is not liable for the quality, safety or legality of meals provided by Hosts, which is the Host's responsibility.<\u002Fp>\n        <h3>10. Term, termination &amp; changes<\u002Fh3>\n        <p>You may close your account at any time. We may suspend or terminate access for breach of these Terms. We may amend these Terms with reasonable notice; continued use after the effective date constitutes acceptance.<\u002Fp>\n        <h3>11. Governing law &amp; disputes<\u002Fh3>\n        <p>These Terms are governed by the laws of the Federal Republic of Germany, excluding the UN Convention on Contracts for the International Sale of Goods. Mandatory consumer-protection provisions of your country of residence remain unaffected. The EU Online Dispute Resolution platform is available at <a href=\"https://ec.europa.eu/consumers/odr\" target=\"_blank\" rel=\"noopener\">ec.europa.eu/consumers/odr<\u002Fa>. We are neither obliged nor willing to participate in dispute-resolution proceedings before a consumer arbitration board.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- PRIVACY -->\n      <section id=\"privacy\" class=\"lg-sec\" style=\"margin-bottom:56px;\">\n        <h2>Privacy Policy<\u002Fh2>\n        <p style=\"color:#8a7aa8; font-size:13px; margin:0;\">In accordance with Art. 13 &amp; 14 GDPR · Effective 13 July 2026<\u002Fp>\n        <h3>1. Controller &amp; Data Protection Officer<\u002Fh3>\n        <p>Controller: bite GmbH, [street &amp; number], Frankfurt am Main, Germany. Email: <a href=\"mailto:privacy@bite.food\">privacy@bite.food<\u002Fa>. You can reach our Data Protection Officer at <a href=\"mailto:dpo@bite.food\">dpo@bite.food<\u002Fa>.<\u002Fp>\n        <h3>2. Categories of data we process<\u002Fh3>\n        <ul>\n          <li><strong>Account &amp; profile:<\u002Fstrong> name, email, phone, password, photo, role (host/guest), city.<\u002Fli>\n          <li><strong>Verification:<\u002Fstrong> ID documents and video-verification data for Hosts.<\u002Fli>\n          <li><strong>Listings &amp; bookings:<\u002Fstrong> menus, allergens, prices, reservations, attendance.<\u002Fli>\n          <li><strong>Payments:<\u002Fstrong> processed by our payment provider; we store transaction metadata, not full card numbers.<\u002Fli>\n          <li><strong>Communications:<\u002Fstrong> in-app messages, support requests, reviews.<\u002Fli>\n          <li><strong>Technical &amp; usage:<\u002Fstrong> device, IP, app interactions, cookies/identifiers.<\u002Fli>\n          <li><strong>Location:<\u002Fstrong> approximate location to show nearby meals (with your permission).<\u002Fli>\n        <\u002Ful>\n        <h3>3. Purposes &amp; legal bases<\u002Fh3>\n        <ul>\n          <li>Providing the service and performing your contract — <strong>Art. 6(1)(b) GDPR<\u002Fstrong>.<\u002Fli>\n          <li>Safety, fraud prevention, service improvement and analytics — <strong>Art. 6(1)(f)<\u002Fstrong> (legitimate interests).<\u002Fli>\n          <li>Optional cookies, marketing and precise location — <strong>Art. 6(1)(a)<\u002Fstrong> (consent).<\u002Fli>\n          <li>Legal, tax and accounting obligations — <strong>Art. 6(1)(c)<\u002Fstrong>.<\u002Fli>\n        <\u002Ful>\n        <h3>4. Recipients &amp; processors<\u002Fh3>\n        <p>We share data only as needed with: our payment service provider, cloud hosting and infrastructure providers, communication/notification tools, and analytics providers — each bound by a data-processing agreement under Art. 28 GDPR. Between users, Hosts and Guests see the profile and booking information necessary to arrange a meal.<\u002Fp>\n        <h3>5. International transfers<\u002Fh3>\n        <p>Where a processor is outside the EU/EEA, transfers are safeguarded by an EU adequacy decision or the EU Standard Contractual Clauses with additional safeguards.<\u002Fp>\n        <h3>6. Retention<\u002Fh3>\n        <p>We keep personal data only as long as necessary for the purposes above: account data for the life of your account, and afterwards only as required by statutory retention periods (e.g. up to 10 years for invoices under German commercial and tax law). Verification documents are deleted once no longer required.<\u002Fp>\n        <h3>7. Your rights<\u002Fh3>\n        <p>You have the right to access (Art. 15), rectification (16), erasure (17), restriction (18), data portability (20) and objection (21), and to withdraw consent at any time (7(3)) without affecting prior processing. To exercise them, contact <a href=\"mailto:privacy@bite.food\">privacy@bite.food<\u002Fa>. You may also lodge a complaint with a supervisory authority — for us, the Hessian Commissioner for Data Protection and Freedom of Information (HBDI), Wiesbaden.<\u002Fp>\n        <h3>8. Automated decisions &amp; children<\u002Fh3>\n        <p>We do not use solely automated decision-making with legal effect under Art. 22 GDPR. bite is not directed at persons under 18 and we do not knowingly collect their data.<\u002Fp>\n        <h3>9. Changes<\u002Fh3>\n        <p>We will post any changes here and, for material changes, notify you in-app or by email.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- COOKIES -->\n      <section id=\"cookies\" class=\"lg-sec\" style=\"margin-bottom:56px;\">\n        <h2>Cookie Policy<\u002Fh2>\n        <p style=\"color:#8a7aa8; font-size:13px; margin:0;\">Under the German TDDDG (§ 25) &amp; GDPR · Effective 13 July 2026<\u002Fp>\n        <h3>1. What cookies are<\u002Fh3>\n        <p>Cookies and similar technologies (local storage, SDK identifiers) store small amounts of data on your device to make the service work and to understand how it is used.<\u002Fp>\n        <h3>2. Categories we use<\u002Fh3>\n        <ul>\n          <li><strong>Strictly necessary<\u002Fstrong> — sign-in, security, load-balancing, saving your session and app state. Always active; no consent required.<\u002Fli>\n          <li><strong>Functional<\u002Fstrong> — remembering preferences such as city, language and filters.<\u002Fli>\n          <li><strong>Analytics<\u002Fstrong> — aggregated, privacy-respecting usage statistics to improve bite.<\u002Fli>\n          <li><strong>Marketing<\u002Fstrong> — measuring campaigns and showing relevant offers.<\u002Fli>\n        <\u002Ful>\n        <p>Functional, analytics and marketing cookies are only set with your consent.<\u002Fp>\n        <h3>3. Managing consent<\u002Fh3>\n        <p>You choose your preferences in the cookie banner on first visit and can change them anytime via <strong>Cookie settings<\u002Fstrong> in the footer, or by clearing cookies in your browser. Withdrawing consent does not affect the lawfulness of prior processing.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- COMMUNITY -->\n      <section id=\"community\" class=\"lg-sec\" style=\"margin-bottom:56px;\">\n        <h2>Community Guidelines<\u002Fh2>\n        <p style=\"color:#8a7aa8; font-size:13px; margin:0;\">The house rules that keep bite safe and warm<\u002Fp>\n        <ul>\n          <li><strong>Be honest.<\u002Fstrong> List meals accurately, including ingredients and all 14 major allergens. Never misrepresent what you're serving.<\u002Fli>\n          <li><strong>Be safe.<\u002Fstrong> Follow food-hygiene best practice. Host group meals; never pressure anyone into an unsafe situation.<\u002Fli>\n          <li><strong>Be respectful.<\u002Fstrong> No discrimination, harassment or hate based on race, ethnicity, religion, gender, sexual orientation, disability or age.<\u002Fli>\n          <li><strong>Keep it on bite.<\u002Fstrong> Communicate and pay only through the app so everyone is protected.<\u002Fli>\n          <li><strong>Protect privacy.<\u002Fstrong> Don't share another person's data or photos without consent.<\u002Fli>\n          <li><strong>Report concerns.<\u002Fstrong> Use in-app reporting or <a href=\"mailto:safety@bite.food\">safety@bite.food<\u002Fa>. We review every report.<\u002Fli>\n        <\u002Ful>\n        <p style=\"margin-top:16px; font-weight:700; color:#6b21d9;\">One trust violation can lead to immediate and permanent suspension.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- GDPR RIGHTS -->\n      <section id=\"gdpr\" class=\"lg-sec\" style=\"margin-bottom:56px;\">\n        <h2>Your data &amp; GDPR rights<\u002Fh2>\n        <p>You are in control of your personal data. Here's how to exercise your rights under the GDPR.<\u002Fp>\n        <h3>How to make a request<\u002Fh3>\n        <p>Email <a href=\"mailto:privacy@bite.food\">privacy@bite.food<\u002Fa> from your registered address, or use \"Download my data\" / \"Delete my account\" in the app settings. We may ask you to verify your identity to protect your account.<\u002Fp>\n        <h3>What you can request<\u002Fh3>\n        <ul>\n          <li>A copy of the personal data we hold about you (data access &amp; portability).<\u002Fli>\n          <li>Correction of inaccurate data.<\u002Fli>\n          <li>Deletion of your data (\"right to be forgotten\"), subject to statutory retention duties.<\u002Fli>\n          <li>Restriction of, or objection to, certain processing.<\u002Fli>\n          <li>Withdrawal of any consent you previously gave.<\u002Fli>\n        <\u002Ful>\n        <h3>Our response time<\u002Fh3>\n        <p>We respond within one month of a verified request, extendable by two further months for complex requests, in which case we will inform you. Our service is free unless a request is manifestly unfounded or excessive.<\u002Fp>\n        <h3>Complaints<\u002Fh3>\n        <p>You may complain to your local data-protection authority. Our lead authority is the Hessian Commissioner for Data Protection and Freedom of Information (HBDI), Wiesbaden, Germany.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- IMPRESSUM -->\n      <section id=\"impressum\" class=\"lg-sec\" style=\"margin-bottom:56px;\">\n        <h2>Impressum<\u002Fh2>\n        <p style=\"color:#8a7aa8; font-size:13px; margin:0;\">Information pursuant to § 5 DDG<\u002Fp>\n        <p style=\"margin-top:14px;\">\n          <strong>bite GmbH<\u002Fstrong><br>\n          [Street &amp; number]<br>\n          60311 Frankfurt am Main<br>\n          Germany\n        <\u002Fp>\n        <h3>Represented by<\u002Fh3>\n        <p>Managing Director(s): [Name(s)]<\u002Fp>\n        <h3>Contact<\u002Fh3>\n        <p>Phone: [+49 …]<br>Email: <a href=\"mailto:hello@bite.food\">hello@bite.food<\u002Fa><\u002Fp>\n        <h3>Register entry<\u002Fh3>\n        <p>Commercial register: Amtsgericht Frankfurt am Main<br>Registration number: HRB [……]<br>VAT identification number (§ 27a UStG): DE[………]<\u002Fp>\n        <h3>Responsible for content pursuant to § 18 (2) MStV<\u002Fh3>\n        <p>[Name], [address as above]<\u002Fp>\n        <h3>EU dispute resolution<\u002Fh3>\n        <p>European Commission Online Dispute Resolution platform: <a href=\"https://ec.europa.eu/consumers/odr\" target=\"_blank\" rel=\"noopener\">ec.europa.eu/consumers/odr<\u002Fa>. We are not obliged or willing to participate in dispute-resolution proceedings before a consumer arbitration board.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- ACCESSIBILITY -->\n      <section id=\"accessibility\" class=\"lg-sec\" style=\"margin-bottom:56px;\">\n        <h2>Accessibility Statement<\u002Fh2>\n        <p>bite is committed to making our app and website usable by everyone, including people with disabilities.<\u002Fp>\n        <h3>Our standard<\u002Fh3>\n        <p>We aim to conform to the Web Content Accessibility Guidelines (WCAG) 2.1 Level AA and to align with the European Accessibility Act. We test with keyboard navigation, sufficient colour contrast, scalable text and screen-reader compatibility, and we work to improve continuously.<\u002Fp>\n        <h3>Feedback<\u002Fh3>\n        <p>If you encounter a barrier, please tell us at <a href=\"mailto:accessibility@bite.food\">accessibility@bite.food<\u002Fa> and we will respond promptly and work to resolve it.<\u002Fp>\n      <\u002Fsection>\n\n      <!-- MODERN SLAVERY -->\n      <section id=\"slavery\" class=\"lg-sec\" style=\"margin-bottom:20px;\">\n        <h2>Modern Slavery Statement<\u002Fh2>\n        <p>bite has zero tolerance for modern slavery, forced labour and human trafficking in our operations and supply chain.<\u002Fp>\n        <h3>Our commitment<\u002Fh3>\n        <p>We expect everyone we work with — employees, contractors and partners — to uphold the same standards. Our Community Guidelines and Terms prohibit exploitative or unlawful conduct, and we act on any credible report. As we grow, we will formalise supplier due-diligence and staff training.<\u002Fp>\n        <h3>Reporting concerns<\u002Fh3>\n        <p>Report any concern confidentially to <a href=\"mailto:ethics@bite.food\">ethics@bite.food<\u002Fa>.<\u002Fp>\n      <\u002Fsection>\n\n      <p style=\"margin-top:40px; padding-top:20px; border-top:1px solid rgba(107,33,217,0.1); font-size:13px; color:#8a7aa8;\">© 2026 bite GmbH · Frankfurt am Main, Germany. These policies are provided in good faith and should be reviewed by legal counsel for your final launch jurisdiction.<\u002Fp>\n    <\u002Fmain>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  componentDidMount() {\n    const scrollToHash = (smooth) => {\n      const id = (location.hash || \"\").replace(\"#\", \"\");\n      if (!id) return;\n      const el = document.getElementById(id);\n      if (!el) return;\n      const top = el.getBoundingClientRect().top + window.pageYOffset - 84;\n      window.scrollTo({ top, behavior: smooth ? \"smooth\" : \"auto\" });\n    };\n    // On initial load, jump to top first, then smooth-scroll to the target so the motion is visible.\n    if (location.hash) {\n      window.scrollTo(0, 0);\n      requestAnimationFrame(() => setTimeout(() => scrollToHash(true), 260));\n    }\n    // Smooth-scroll for TOC / in-page clicks and hash changes.\n    this._onHash = () => scrollToHash(true);\n    window.addEventListener(\"hashchange\", this._onHash);\n    this._onClick = (e) => {\n      const a = e.target.closest && e.target.closest('a[href^=\"#\"]');\n      if (!a) return;\n      const id = a.getAttribute(\"href\").slice(1);\n      const el = document.getElementById(id);\n      if (!el) return;\n      e.preventDefault();\n      const top = el.getBoundingClientRect().top + window.pageYOffset - 84;\n      window.scrollTo({ top, behavior: \"smooth\" });\n      if (history.replaceState) history.replaceState(null, \"\", \"#\" + id);\n    };\n    document.addEventListener(\"click\", this._onClick);\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"hashchange\", this._onHash);\n    document.removeEventListener(\"click\", this._onClick);\n  }\n  componentDidMount() {\n    const goto = () => {\n      const id = (location.hash || \"\").slice(1);\n      if (!id) return;\n      const el = document.getElementById(id);\n      if (!el) return;\n      const top = el.getBoundingClientRect().top + window.pageYOffset - 84;\n      window.scrollTo({ top, behavior: \"smooth\" });\n      el.style.transition = \"background .25s\";\n      el.style.background = \"rgba(155,74,255,0.06)\";\n      el.style.borderRadius = \"14px\";\n      setTimeout(() => { el.style.background = \"transparent\"; }, 1100);\n    };\n    setTimeout(goto, 80);\n    this._onHash = goto;\n    window.addEventListener(\"hashchange\", this._onHash);\n  }\n  componentWillUnmount() {\n    if (this._onHash) window.removeEventListener(\"hashchange\", this._onHash);\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
